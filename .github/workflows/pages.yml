name: Pages
# main に入った play/（ビルド済みの遊べるHTML）をそのまま GitHub Pages に公開する
on:
  push:
    branches: [main]
    paths: ['play/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: play
      - id: deployment
        uses: actions/deploy-pages@v4
